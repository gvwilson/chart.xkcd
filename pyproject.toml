[project]
name = "chart-xkcd"
dynamic = ["version"]
description = "Python API for generating XKCD-style charts"
keywords = ["charts"]
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "anywidget>=0.9.0",
    "marimo>=0.19.11",
]

[project.urls]
Repository = "https://github.com/gvwilson/chart.xkcd"
Documentation = "https://chartxkcd.readthedocs.io"

[project.scripts]
chart_xkcd = "chart_xkcd.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chart_xkcd"]
artifacts = [
    "src/chart_xkcd/static/chart.xkcd.js",
]

[tool.hatch.version]
path = "src/chart_xkcd/__init__.py"

[tool.hatch.build.targets.sdist]
artifacts = [
    "src/chart_xkcd/static/chart.xkcd.js",
]

[dependency-groups]
dev = [
    "build>=1.4.0",
    "markdown-include>=0.8.1",
    "mkdocs>=1.6.1",
    "mkdocs-awesome-pages-plugin>=2.10.1",
    "mkdocs-material>=9.7.1",
    "mkdocstrings[python]>=1.0.0",
    "ruff>=0.14.10",
    "twine>=6.2.0",
]
